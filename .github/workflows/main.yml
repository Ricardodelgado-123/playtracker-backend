name: PlayTracker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Instalar Dependencias
      run: npm install
      
    - name: Ejecutar Pruebas y Generar Reporte de Cobertura
      run: npm test
      
    - name: Simular Despliegue (CD)
      run: echo "Despliegue simulado exitoso. Software listo para producción."