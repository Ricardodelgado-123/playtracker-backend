<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayTracker | SaaS Deportivo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a; --bg-panel: #1e293b; --bg-card: #0f172a;
            --primary: #3b82f6; --accent: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --training: #0ea5e9; --game: #f43f5e; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .app-container { width: 100%; max-width: 1200px; background: var(--bg-panel); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 700px; border: 1px solid #334155; }
        header { background: #0b1120; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 22px; font-weight: 800; color: white; }
        .logo i { color: var(--primary); }
        .user-controls { display: none; align-items: center; gap: 15px; }
        .btn-logout { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 5px 15px; border-radius: 6px; cursor: pointer; }

        #login-view { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        .login-box { background: var(--bg-card); padding: 40px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #334155; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: var(--bg-panel); color: white; outline: none; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #dashboard-view { display: none; padding: 30px; gap: 25px; grid-template-columns: 1fr 1fr; flex-grow: 1; align-items: start; }
        @media (max-width: 900px) { #dashboard-view { grid-template-columns: 1fr; } }
        
        .card { background: var(--bg-card); border-radius: 12px; padding: 20px; border: 1px solid #334155; display: none; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155; font-size: 18px; font-weight: bold; }

        /* Calendario */
        .event-list { display: flex; flex-direction: column; gap: 15px; }
        .event-item { background: var(--bg-panel); padding: 15px; border-radius: 8px; position: relative; overflow: hidden; }
        .event-type-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
        .type-entrenamiento { background-color: var(--training); }
        .type-partido { background-color: var(--game); }
        .event-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; margin-left: 10px; }
        .event-details { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 14px; margin-bottom: 15px; margin-left: 10px; }
        .maps-link { color: var(--primary); text-decoration: none; font-weight: bold; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 4px; }
        .attendance-actions { display: flex; gap: 10px; margin-left: 10px; }
        .btn-asisto { background: var(--accent); color: #000; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-no-asisto { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .coach-stats { margin-left: 10px; display: flex; gap: 15px; font-size: 14px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; }
        .stat-green { color: var(--accent); font-weight: bold; }
        .stat-red { color: var(--danger); font-weight: bold; }

        /* Pestañas del Playbook */
        .tabs-container { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 5px; overflow-x: auto; }
        .play-tab { background: var(--bg-panel); padding: 8px 15px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; color: var(--text-muted); border: 1px solid transparent; border-bottom: none; white-space: nowrap; transition: 0.2s; }
        .play-tab.active { background: var(--primary); color: white; font-weight: bold; border-color: var(--primary); }
        .play-tab-add { background: transparent; color: var(--accent); padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 6px; }
        .play-tab-add:hover { background: rgba(16, 185, 129, 0.1); }

        /* Creador de Alineación */
        .roster-container { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 10px; min-height: 45px; }
        .player-chip { background: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .player-chip.selected { background: var(--warning); color: #000; font-weight: bold; transform: scale(1.1); border: 2px solid white; }
        
        /* Medio Campo Realista CSS */
        .field-map { 
            width: 100%; height: 320px; 
            background-color: #1a5c31; /* Verde césped */
            border: 3px solid white; 
            border-bottom: 8px solid white; /* Línea de gol simulada */
            position: relative; 
            overflow: hidden;
            background-image: 
                linear-gradient(to bottom, rgba(255,255,255,0.4) 2px, transparent 2px), /* Yardas horizontales */
                linear-gradient(to right, transparent 48%, rgba(255,255,255,0.2) 48%, rgba(255,255,255,0.2) 52%, transparent 52%); /* Hash marks centrales */
            background-size: 100% 20%, 100% 100%;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }
        
        /* Nodos arrastrables */
        .position-node { 
            position: absolute; width: 45px; height: 45px; 
            background: rgba(0,0,0,0.8); border: 2px dashed rgba(255,255,255,0.6); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            color: white; font-size: 11px; font-weight: bold; cursor: grab; text-align: center; 
            transition: background 0.2s, border 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); z-index: 10;
        }
        .position-node:active { cursor: grabbing; }
        .position-node.assigned { background: var(--primary); border: 2px solid white; }
        
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo"><i class="fa-solid fa-football"></i> PlayTracker</div>
        <div class="user-controls" id="user-controls">
            <span id="user-name" style="font-weight:bold; color:var(--primary);"></span>
            <button class="btn-logout" onclick="cerrarSesion()">Salir</button>
        </div>
    </header>

    <div id="login-view">
        <div class="login-box">
            <h2 style="margin-bottom:20px;">Acceso a Liga</h2>
            <input type="text" id="username" placeholder="Usuario (coach, atleta...)">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="iniciarSesion()">Entrar</button>
            <p id="login-error" style="color:var(--danger); margin-top:10px; display:none;">Error de credenciales</p>
        </div>
    </div>

    <div id="dashboard-view">
        <!-- Alineación Táctica (Solo Coach) -->
        <div class="card module-coach" id="card-alineacion">
            <div class="card-header"><i class="fa-solid fa-chess-board" style="color:var(--primary);"></i> Pizarra Táctica Profesional</div>
            
            <div class="tabs-container" id="tabs-container">
                <!-- Se llenan por JS -->
            </div>

            <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Selecciona un jugador arriba y toca una posición. Para quitarlo, solo da clic en él en el campo. Arrastra libremente los círculos.</p>
            <div class="roster-container" id="roster-list"></div>
            
            <div class="field-map" id="field-container">
                <!-- Los nodos se inyectan por JS dependiendo la pestaña -->
            </div>
        </div>

        <!-- Control Físico (Solo Atleta) -->
        <div class="card module-atleta" id="card-salud">
            <div class="card-header"><i class="fa-solid fa-heart-pulse" style="color:var(--accent);"></i> Estado Físico de Hoy</div>
            <select id="fatiga" style="width:100%; padding:12px; background:var(--bg-panel); color:white; border:1px solid #334155; border-radius:8px;">
                <option value="1">Nivel 1: Al 100%, sin molestias</option>
                <option value="2">Nivel 2: Cansancio general</option>
                <option value="3">Nivel 3: Molestia muscular leve</option>
                <option value="4">Nivel 4: Dolor agudo (Riesgo)</option>
                <option value="5">Nivel 5: LESIÓN (No puedo jugar)</option>
            </select>
        </div>

        <!-- Calendario (Todos) -->
        <div class="card" id="card-eventos" style="display:block;">
            <div class="card-header"><i class="fa-regular fa-calendar-days" style="color:var(--warning);"></i> Calendario de Liga</div>
            <div class="event-list" id="calendario-lista">Cargando...</div>
        </div>
    </div>
</div>

<script>
    let activeRole = '';
    let selectedPlayer = null;
    let fullRoster = [];

    // Estado de las Pestañas (Playbooks)
    let playbooks = [
        generateDefaultPlaybook("Jugada Ofensiva 1")
    ];
    let currentTabIndex = 0;

    function generateDefaultPlaybook(name) {
        return {
            name: name,
            nodes: [
                { id: 'pos1', defaultName: 'QB', playerName: null, left: '45%', top: '75%' },
                { id: 'pos2', defaultName: 'C', playerName: null, left: '45%', top: '50%' },
                { id: 'pos3', defaultName: 'WR1', playerName: null, left: '10%', top: '50%' },
                { id: 'pos4', defaultName: 'WR2', playerName: null, left: '80%', top: '50%' },
                { id: 'pos5', defaultName: 'RB', playerName: null, left: '30%', top: '75%' }
            ]
        };
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('playtracker_token');
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(endpoint, options);
        if (!res.ok) throw await res.json();
        return res.json();
    }

    async function iniciarSesion() {
        try {
            const data = await apiRequest('/api/login', 'POST', {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            });
            localStorage.setItem('playtracker_token', data.token);
            localStorage.setItem('playtracker_role', data.role);
            localStorage.setItem('playtracker_name', data.nombre);
            configurarDashboard();
        } catch (error) {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function configurarDashboard() {
        const token = localStorage.getItem('playtracker_token');
        if (!token) return;

        activeRole = localStorage.getItem('playtracker_role');
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'grid';
        document.getElementById('user-controls').style.display = 'flex';
        document.getElementById('user-name').innerText = localStorage.getItem('playtracker_name') + ' (' + activeRole + ')';

        if (activeRole === 'Head Coach') {
            document.getElementById('card-alineacion').style.display = 'block';
            document.getElementById('card-salud').style.display = 'none';
            cargarRoster();
        } else {
            document.getElementById('card-alineacion').style.display = 'none';
            document.getElementById('card-salud').style.display = 'block';
        }
        cargarEventos();
    }

    async function cargarEventos() {
        try {
            const eventos = await apiRequest('/api/eventos');
            const contenedor = document.getElementById('calendario-lista');
            contenedor.innerHTML = '';
            eventos.forEach(ev => {
                const isPartido = ev.tipo === 'Partido';
                const colorClass = isPartido ? 'type-partido' : 'type-entrenamiento';
                const titulo = isPartido ? `${ev.equipoLocal} vs ${ev.rival}` : ev.rival;
                const iconoMapa = `<a href="https://www.google.com/maps/search/?api=1&query=${ev.linkMapa}" target="_blank" class="maps-link"><i class="fa-solid fa-map-location-dot"></i> Ir al Mapa</a>`;

                let accionesHTML = '';
                if (activeRole === 'Jugador') {
                    accionesHTML = `
                        <div class="attendance-actions" id="acciones-${ev.id}">
                            <button class="btn-asisto" onclick="enviarAsistencia(${ev.id}, true)">✅ Asisto</button>
                            <button class="btn-no-asisto" onclick="enviarAsistencia(${ev.id}, false)">❌ Faltaré</button>
                        </div>`;
                } else if (activeRole === 'Head Coach') {
                    accionesHTML = `
                        <div class="coach-stats">
                            <span><i class="fa-solid fa-user-check"></i> Confirmados: <span class="stat-green">${ev.stats.asisten}</span></span>
                            <span><i class="fa-solid fa-user-xmark"></i> Ausentes: <span class="stat-red">${ev.stats.faltan}</span></span>
                        </div>`;
                }

                contenedor.innerHTML += `
                    <div class="event-item">
                        <div class="event-type-bar ${colorClass}"></div>
                        <div class="event-title">${titulo} <span style="font-size:12px; font-weight:normal; color:#cbd5e1; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px; margin-left:5px;">${ev.tipo}</span></div>
                        <div class="event-details">
                            <span><i class="fa-regular fa-clock"></i> ${ev.fecha}</span>
                            <span><i class="fa-solid fa-location-dot"></i> ${ev.lugar} &nbsp; ${iconoMapa}</span>
                        </div>
                        ${accionesHTML}
                    </div>`;
            });
        } catch(e) { console.error(e); }
    }

    async function enviarAsistencia(eventoId, asiste) {
        const fatiga = document.getElementById('fatiga').value;
        try {
            await apiRequest('/api/asistencia', 'POST', { evento_id: eventoId, asiste, fatiga });
            document.getElementById(`acciones-${eventoId}`).innerHTML = `<span style="color:var(--accent); font-weight:bold;">¡Respuesta guardada!</span>`;
        } catch(e) { alert('Error al guardar'); }
    }

    /* --- SISTEMA DE TABS Y ALINEACIÓN (HEAD COACH) --- */

    async function cargarRoster() {
        if(fullRoster.length === 0) {
            fullRoster = await apiRequest('/api/roster');
        }
        renderPlaybookInterface();
    }

    function renderPlaybookInterface() {
        renderTabs();
        renderRosterUI();
        renderFieldNodes();
    }

    function renderTabs() {
        const container = document.getElementById('tabs-container');
        container.innerHTML = '';
        playbooks.forEach((pb, index) => {
            const isActive = index === currentTabIndex ? 'active' : '';
            container.innerHTML += `<div class="play-tab ${isActive}" onclick="switchTab(${index})" ondblclick="renameTab(${index})" title="Doble clic para renombrar">${pb.name}</div>`;
        });
        if (playbooks.length < 5) {
            container.innerHTML += `<div class="play-tab-add" onclick="addTab()">+ Nueva Jugada</div>`;
        }
    }

    function switchTab(index) {
        saveCurrentNodePositions();
        currentTabIndex = index;
        selectedPlayer = null;
        renderPlaybookInterface();
    }

    function addTab() {
        if(playbooks.length >= 5) return;
        saveCurrentNodePositions();
        playbooks.push(generateDefaultPlaybook(`Jugada ${playbooks.length + 1}`));
        currentTabIndex = playbooks.length - 1;
        renderPlaybookInterface();
    }

    function renameTab(index) {
        const newName = prompt("Nombre de la jugada (Ej. Ofensiva Blitz):", playbooks[index].name);
        if (newName && newName.trim() !== "") {
            playbooks[index].name = newName.trim();
            renderTabs();
        }
    }

    function renderRosterUI() {
        const container = document.getElementById('roster-list');
        container.innerHTML = '';
        
        // Determinar qué jugadores ya están asignados en la pestaña actual
        const assignedPlayers = playbooks[currentTabIndex].nodes.map(n => n.playerName).filter(name => name !== null);

        fullRoster.forEach(jugador => {
            // Solo renderizar si NO está asignado en el campo
            if (!assignedPlayers.includes(jugador.nombre)) {
                const isSelected = selectedPlayer === jugador.nombre ? 'selected' : '';
                container.innerHTML += `<div class="player-chip ${isSelected}" onclick="seleccionarJugador('${jugador.nombre}')">${jugador.nombre}</div>`;
            }
        });
    }

    function seleccionarJugador(nombre) {
        selectedPlayer = selectedPlayer === nombre ? null : nombre; // Toggle
        renderRosterUI();
    }

    function renderFieldNodes() {
        const field = document.getElementById('field-container');
        field.innerHTML = '';
        
        playbooks[currentTabIndex].nodes.forEach((nodeData, index) => {
            const isAssigned = nodeData.playerName !== null;
            const nodeClass = isAssigned ? 'position-node assigned' : 'position-node';
            const displayText = isAssigned ? nodeData.playerName : nodeData.defaultName;

            const el = document.createElement('div');
            el.className = nodeClass;
            el.style.left = nodeData.left;
            el.style.top = nodeData.top;
            el.innerText = displayText;
            
            // Evento para Asignar / Desasignar (Click)
            el.addEventListener('click', (e) => {
                if (window.isDraggingNode) return; // Evitar clic si se estaba arrastrando

                if (nodeData.playerName) {
                    // DESASIGNAR: Regresar al roster
                    nodeData.playerName = null;
                    selectedPlayer = null;
                    renderPlaybookInterface();
                } else if (selectedPlayer) {
                    // ASIGNAR: Poner jugador seleccionado
                    nodeData.playerName = selectedPlayer;
                    selectedPlayer = null;
                    renderPlaybookInterface();
                }
            });

            // Hacerlo arrastrable
            makeDraggable(el, nodeData);
            field.appendChild(el);
        });
    }

    function saveCurrentNodePositions() {
        // Las posiciones se guardan en tiempo real en la función makeDraggable
    }

    // Lógica Drag & Drop Libre
    function makeDraggable(elmnt, nodeDataRef) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        let isDragThresholdMet = false;

        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragMouseDown; // Soporte móvil

        function dragMouseDown(e) {
            e.preventDefault();
            window.isDraggingNode = false;
            isDragThresholdMet = false;

            const ev = e.type === 'touchstart' ? e.touches[0] : e;
            pos3 = ev.clientX;
            pos4 = ev.clientY;
            
            document.onmouseup = closeDragElement;
            document.ontouchend = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            const ev = e.type === 'touchmove' ? e.touches[0] : e;
            
            // Detectar si el movimiento es suficiente para considerarse "arrastre" y no un click
            if (Math.abs(pos3 - ev.clientX) > 3 || Math.abs(pos4 - ev.clientY) > 3) {
                isDragThresholdMet = true;
                window.isDraggingNode = true; 
            }

            if (!isDragThresholdMet) return;

            e.preventDefault();
            pos1 = pos3 - ev.clientX;
            pos2 = pos4 - ev.clientY;
            pos3 = ev.clientX;
            pos4 = ev.clientY;

            // Limites del campo
            const parentRect = elmnt.parentElement.getBoundingClientRect();
            let newTop = elmnt.offsetTop - pos2;
            let newLeft = elmnt.offsetLeft - pos1;

            if (newTop < 0) newTop = 0;
            if (newLeft < 0) newLeft = 0;
            if (newTop + elmnt.offsetHeight > parentRect.height) newTop = parentRect.height - elmnt.offsetHeight;
            if (newLeft + elmnt.offsetWidth > parentRect.width) newLeft = parentRect.width - elmnt.offsetWidth;

            elmnt.style.top = newTop + "px";
            elmnt.style.left = newLeft + "px";

            // Guardar en el estado para cuando cambiemos de pestaña
            nodeDataRef.top = newTop + "px";
            nodeDataRef.left = newLeft + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
            
            // Pequeño delay para no disparar el evento click inmediatamente después de soltar
            setTimeout(() => { window.isDraggingNode = false; }, 50);
        }
    }

    function cerrarSesion() { localStorage.clear(); location.reload(); }
    if(localStorage.getItem('playtracker_token')) configurarDashboard();
</script>

</body>
</html>
